<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Eventos Culturais</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <section id="tela-login">
    <div class="login-container">
        <div class="login-logo">
    <img
        src="imagens/logo-supremo.PNG"
        alt="Supremo Conselho"
    >
    </div>
        <h2>Acesso ao Sistema</h2>

        <form id="form-login">
            <div class="campo-formulario">
                <label for="login-email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="login-email"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="campo-formulario">
                <label for="login-senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="login-senha"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div
                id="erro-login"
                class="mensagem-erro"
            ></div>

            <button
                type="submit"
                id="botao-login"
            >
                Entrar
            </button>
        </form>
    </div>
</section>

<div id="sistema-principal" hidden>

    <header class="cabecalho-principal">

    <div class="cabecalho-identidade">

        <img
            src="imagens/logo-supremo.PNG"
            alt="Supremo Conselho do Grau 33"
            class="logo-supremo"
        >

        <div>
            <h1>
                Sistema Cadastro de Eventos Culturais.
            </h1>

            <h2>
                20ª Região (Andradina, Guaraçaí e Pereira Barreto).
            </h2>

            <p>
                Controle de eventos e presenças.
            </p>
        </div>

    </div>

</header>

    <nav class="menu-principal">
        <button
            type="button"
            class="botao-menu ativo"
            data-modulo="membros"
        >
            Membros
        </button>

        <button
            type="button"
            class="botao-menu"
            data-modulo="eventos"
        >
            Eventos
        </button>

        <button
            type="button"
            class="botao-menu"
            data-modulo="presencas"
        >
            Presenças
        </button>

        <button
            type="button"
            class="botao-menu"
            data-modulo="relatorios"
        >
            Relatórios
        </button>

        <button
    type="button"
    class="botao-menu botao-backup"
    id="botao-backup"
>
    Backup
</button>

<button
    type="button"
    class="botao-menu botao-restaurar"
    id="botao-restaurar-backup"
>
    Restaurar Backup
</button>

<button
    type="button"
    id="botao-sair"
>
    Sair
</button>

<input
    type="file"
    id="arquivo-backup"
    accept=".json,application/json"
    hidden
>

    </nav>

    <main
        id="conteudo-principal"
        class="conteudo-principal"
    >
        <section>
            <h2>Membros</h2>

            <p>
                Cadastro e consulta de membros.
            </p>
        </section>
    </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>  
    <script src="js/auth.js"></script>
    <script src="js/banco.js"></script>
    <script src="js/membros.js"></script>
    <script src="js/eventos.js"></script>
    <script src="js/presencas.js"></script>
    <script src="js/relatorios.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
